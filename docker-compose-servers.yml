services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.235.17.60:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 200000000
    ports:
      - "9092:9092"
    networks:
      - app-network

  postgresql:
    image: postgres:latest
    environment:
      POSTGRES_USER: semicon
      POSTGRES_PASSWORD: semicon
      POSTGRES_DB: semicon
    ports:
      - "3502:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: semicon
      MYSQL_DATABASE: semicon
      MYSQL_USER: semicon
      MYSQL_PASSWORD: semicon
    ports:
      - "3503:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "3505:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network

  typesense:
    image: typesense/typesense:0.24.1
    command: --data-dir /data --api-key=Outdid2025 --listen-port=8108
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    restart: always

volumes:
  postgres-data:
  mysql-data:
  mongo-data:
  redis-data:
  typesense_data:

networks:
  app-network:
    driver: bridge
